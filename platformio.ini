; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = esp12e
monitor_speed = 115200
framework = arduino
upload_speed = 921600
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    arduino-libraries/NTPClient@^3.2.1
    jchristensen/Timezone@^1.2.4
    rlogiacco/CircularBuffer@^1.4.0
    ayushsharma82/ElegantOTA@^3.1.6
    vshymanskyy/Preferences@^2.2.2
    esp32async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^6.21.5
lib_ignore =
    ESP Async WebServer
; deep+ so ArduinoJson's headers are visible when ESPAsyncWebServer's own
; AsyncJson.cpp compiles (it guards its ArduinoJson support behind
; __has_include(<ArduinoJson.h>)); chain modes don't cross into a sibling lib.
lib_ldf_mode = deep+
build_flags =
    -D DEBUG_ESP_OOM
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; Put ArduinoJson on every translation unit's include path so
    ; AsyncCallbackJsonWebHandler (used by web_server.cpp's jsonHandler()) is
    ; actually emitted when ESPAsyncWebServer is compiled in isolation.
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/ArduinoJson/src"
    ; Touch-pad diagnostics over Wi-Fi (GET /api/touchraw, read by
    ; tools/touch_watch.py, plus raw readings logged per press). Uncomment to
    ; re-tune on wall power; costs ~2.8 KB RAM.
    ; -D TOUCH_DIAG

; Touch-pad tuning firmware (tools/touch_tuner/): streams raw RC-pad readings
; over serial while the OLED walks you through a touch test. Not built by a
; plain `pio run`. Flash: pio run -e touch_tuner -t upload
; Capture/analyse:  ~/.platformio/penv/bin/python tools/touch_capture.py
[env:touch_tuner]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../tools/touch_tuner/>
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    vshymanskyy/Preferences@^2.2.2
